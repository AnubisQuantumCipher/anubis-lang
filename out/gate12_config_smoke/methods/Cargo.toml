[workspace]

[package]
name = "methods"
version = "0.1.0"
edition = "2021"

[build-dependencies]
risc0-build = { version = "=3.0.5" }
risc0-circuit-rv32im = { version = "=4.0.4", features = ["prove"] }

[package.metadata.risc0]
methods = ["guest"]

[lib]
path = "src/lib.rs"

# Use the canonical Desktop metal-hybrid-prover rv32im circuit implementation.
[patch.crates-io]
risc0-circuit-rv32im = { path = "/Users/sicarii/Desktop/metal-hybrid-prover/vendor/risc0-circuit-rv32im" }
