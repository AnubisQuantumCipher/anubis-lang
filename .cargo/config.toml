# The aarch64-linux-musl guest binary. Without this, cargo links the musl target with the HOST
# Apple `cc`, which rejects GNU ld flags:
#
#   ld: unknown options: --as-needed -Bstatic -Bdynamic --eh-frame-hdr -z --gc-sections
#
# The COMPILE succeeds without it — only the link fails — so the error reads like a code problem
# rather than a toolchain one. `brew install FiloSottile/musl-cross/musl-cross` provides the linker.
[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
