[package]
name = "anubis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "anubis"
path = "src/main.rs"

[dependencies]
anubis-compiler = { path = "../../compiler" }
clap.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
walkdir.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bincode = "1.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
rcgen = "0.13"
risc0-zkvm = { version = "=3.0.5", features = ["prove", "std", "disable-dev-mode"] }
risc0-circuit-rv32im = { version = "=4.0.4", features = ["prove"] }
