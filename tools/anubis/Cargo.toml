[package]
name = "anubis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "anubis"
path = "src/main.rs"

[dependencies]
anubis-compiler = { path = "../../compiler" }
clap.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
walkdir.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bincode = "1.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
rcgen = "0.13"
# AOP mTLS listener (opt-in; plain HTTP remains default bind path).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
risc0-zkvm = { version = "=3.0.5", features = ["prove", "std", "disable-dev-mode"] }
risc0-circuit-rv32im = { version = "=4.0.4", features = ["prove"] }

# Native Apple Virtualization.framework backend (`anubis vz native-preflight`). Apple Silicon macOS
# only — a true zero-NIC air-gap + per-hostname egress substrate that tart cannot express. Boots a VM
# only when the binary carries the com.apple.security.virtualization entitlement (scripts/build_signed_anubis.sh).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = "0.3"
block2 = "0.6"
libc = "0.2"
