[workspace]
resolver = "2"
members = [
    "compiler",
    "tools/anubis",
    "solver",
]

# For RISC0 receipt (Gate 10+) on Apple Silicon: use the in-repo vendored
# patched circuit crate. The vendor/ tree is checked into this repo; no
# external path dependency is required.
#
# risc0-sys is vendored + patched: Apple poolstl workers get 64 MB stacks so the
# CPU prover does not SIGBUS, and hosted builds may substitute an empty Metal library while
# retaining CPU kernels. The exact divergences live under patches/risc0-sys-1.5.0-*.diff.
[patch.crates-io]
risc0-circuit-rv32im = { path = "vendor/risc0-circuit-rv32im" }
risc0-sys = { path = "vendor/risc0-sys" }

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sicarii Amun'ra"]
license = "BUSL-1.1"
description = "Anubis language - dual-use systems programming for bounty hunters and sovereign systems"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
toml = "0.8"
hex = "0.4"
ed25519-dalek = "2"
getrandom = "0.2"
tempfile = "3"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
pretty_assertions = "1"
ariadne = "0.4"
