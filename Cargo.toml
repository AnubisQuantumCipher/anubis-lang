[workspace]
resolver = "2"
members = [
    "compiler",
    "tools/anubis",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sicarii Amun'ra"]
license = "Apache-2.0 OR MIT"
description = "Anubis language - dual-use systems programming for bounty hunters and sovereign systems"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
pretty_assertions = "1"
ariadne = "0.4"
