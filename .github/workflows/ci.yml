name: anubis-ci

# The single source of truth for "is this green?" is the SAME front door a
# stranger runs on a fresh clone: scripts/audit_a_plus.sh -> scripts/audit_unified.sh
# (15 fail-closed gates G1-G15, non-zero exit on any FAIL). CI runs THAT real
# suite, not a hand-picked subset of cargo commands, so "green in CI" ==
# "green on a fresh clone" rather than "green on a weaker check".
#
# The prove gate (G10) cold-VERIFIES the committed ZK receipt fixture using only
# the built binary — it never runs the risc0 prover or Metal — so it executes on
# a stock GitHub runner. That makes CI a public, off-the-author's-desk witness
# that the crown-jewel cold-verify reproduces.
on: [push, pull_request]

jobs:
  sealed-gate-suite:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Pin the SAME nightly the compiler + VM seal + self-host fixpoint are built
      # with (rust-toolchain.toml). Using `stable` here made rustfmt/clippy diverge
      # from the author's toolchain and failed G1/G2 on version skew alone.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-10
          components: rustfmt, clippy
      # ripgrep is used by the gate scripts (not preinstalled on macOS runners);
      # python3, jq, shasum, and clang already are.
      - name: Install ripgrep
        run: brew install ripgrep
      # z3 is the checker's default authoritative solver + the native cross-check. Pin
      # the SAME version the author develops + seals against (4.15.4): the QF_FP float
      # lane depends on z3's version-specific float reasoning (e.g. proving x*x < x for
      # 0<x<1), so brew-latest drifts and fails the float fixtures. When z3 can't prove,
      # the checker fails closed (rejects) — a completeness difference, never a false
      # accept — but a pinned z3 makes "green in CI" == "green in the reference env".
      - name: Install pinned z3 4.15.4 (reference version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download z3-4.15.4 --repo Z3Prover/z3 --pattern '*arm64-osx*.zip' --output z3.zip \
            || gh release download z3-4.15.4 --repo Z3Prover/z3 --pattern '*x64-osx*.zip' --output z3.zip
          unzip -q z3.zip
          Z3DIR="$(find . -maxdepth 1 -type d -name 'z3-4.15.4*' | head -1)"
          echo "$PWD/$Z3DIR/bin" >> "$GITHUB_PATH"
          "$PWD/$Z3DIR/bin/z3" --version
      - name: Run the full sealed gate suite (the advertised front door)
        run: bash scripts/audit_a_plus.sh --out out/ci_gate
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          # Upload the whole gate dir — including the per-gate gN.log detail — so a
          # red gate is diagnosable from the artifact without re-running locally.
          path: out/ci_gate/
