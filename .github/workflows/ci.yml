name: anubis-ci

# The default full seal remains `scripts/audit_a_plus.sh`: 15/15, no failures,
# skips, or external gates. A stock GitHub macOS runner cannot provide nested
# Apple virtualization, the canonical anubis-xcode Tart image, or the operator
# SSH key, so it must not pretend to certify G9.
#
# Push/PR CI runs the explicit `hosted` profile: 14 host-verifiable gates plus
# G9=EXTERNAL, with G14 limited to its non-executing host isolation witness,
# verdict HOSTED_PASS. A manually dispatched job on a dedicated Tart/VZ runner
# executes the unchanged full front door and is the only job in this workflow
# allowed to claim the full G9/G14 execution seal.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hosted-gate-witness:
    name: hosted-gate-witness
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Pin the SAME nightly the compiler + VM seal + self-host fixpoint are built
      # with (rust-toolchain.toml). Using `stable` here made rustfmt/clippy diverge
      # from the author's toolchain and failed G1/G2 on version skew alone.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-10
          components: rustfmt, clippy
      # ripgrep is used by the gate scripts (not preinstalled on macOS runners);
      # python3, jq, shasum, and clang already are.
      - name: Install ripgrep
        run: brew install ripgrep
      # z3 is the checker's default authoritative solver + the native cross-check. Pin
      # the SAME version the author develops + seals against (4.15.4): the QF_FP float
      # lane depends on z3's version-specific float reasoning (e.g. proving x*x < x for
      # 0<x<1), so brew-latest drifts and fails the float fixtures. When z3 can't prove,
      # the checker fails closed (rejects) — a completeness difference, never a false
      # accept — but a pinned z3 makes "green in CI" == "green in the reference env".
      - name: Install pinned z3 4.15.4 (reference version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download z3-4.15.4 --repo Z3Prover/z3 --pattern '*arm64-osx*.zip' --output z3.zip \
            || gh release download z3-4.15.4 --repo Z3Prover/z3 --pattern '*x64-osx*.zip' --output z3.zip
          unzip -q z3.zip
          Z3DIR="$(find . -maxdepth 1 -type d -name 'z3-4.15.4*' | head -1)"
          echo "$PWD/$Z3DIR/bin" >> "$GITHUB_PATH"
          "$PWD/$Z3DIR/bin/z3" --version
      - name: Run host-verifiable gates with an explicit external VZ boundary
        run: bash scripts/audit_unified.sh --profile hosted --out out/ci_gate
      - name: Upload hosted gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-gate-report
          path: out/ci_gate/

  sealed-vz-gate-suite:
    name: sealed-vz-gate-suite
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, tart-vz]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-10
          components: rustfmt, clippy
      - name: Require the canonical Tart/VZ environment
        run: |
          command -v tart
          test -f "$HOME/.ssh/tart_anubis"
          tart list
      - name: Run the full 15-gate sealed front door
        run: bash scripts/audit_a_plus.sh --out out/ci_sealed_vz
      - name: Upload full sealed gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-vz-gate-report
          path: out/ci_sealed_vz/
