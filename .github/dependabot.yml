# Dependabot keeps the dependency surface patched.
#
# A language whose thesis is "the checker found no known path around the stated
# policy, and refused undecidable obligations" cannot ignore dependency risk. Grouped updates keep the PR
# volume reviewable; the vendored tree is excluded because it is a pinned fork
# proven equal to upstream-plus-a-reviewable-diff, and Dependabot would break
# that proof.

version: 2

updates:
  # ── Rust workspace ────────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
    ignore:
      # Only the two workspace-patched crates are excluded. A wildcard also hid
      # unvendored risc0-zkvm updates, which are part of the ordinary dependency surface.
      - dependency-name: "risc0-circuit-rv32im"
      - dependency-name: "risc0-sys"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # Actions are executable code running with repository credentials. Pin them
  # and update them on purpose.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

  # ── Editor JavaScript lockfiles ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/editors/tree-sitter-anubis"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(editor)"

  - package-ecosystem: npm
    directory: "/editors/vscode-anubis"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(editor)"
